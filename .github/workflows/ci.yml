name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --quiet -e ".[dev]" ruff
      - name: Lint (pyflakes rules)
        run: ruff check pland tests tools
      - name: Unit tests (scripted model, no network, no key)
        env:
          PLAND_SKIP_DOCKER: "1"
        run: python -m pytest -q
      - name: Dependency vulnerability scan (informational)
        continue-on-error: true
        run: python -m pip install --quiet pip-audit && python -m pip_audit
