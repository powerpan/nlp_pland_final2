[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pland"
version = "0.1.0"
description = "PlanD: a single-agent-first, multi-agent collaboration platform (DeepSeek / HKGAI backends)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pland = "pland.cli:main"

[tool.setuptools.packages.find]
include = ["pland*"]

[tool.setuptools.package-data]
pland = ["server/static/*", "eval/suites/**/*", "team_templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# pyflakes rules only (undefined names, unused imports/variables); style is not enforced
select = ["F", "E9"]
