<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PlanD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='%23d4441c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-weight='700' font-size='19' text-anchor='middle' fill='%23fffdf8'%3ED%3C/text%3E%3C/svg%3E">
  <script src="boot.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Conversations" data-i18n="aria-label">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">D</div>
      <div class="brand-text">
        <div class="brand-name">PlanD</div>
        <div id="brand-sub" class="brand-sub" data-i18n>connecting…</div>
      </div>
      <button id="hitl-badge" class="hitl-badge hidden" type="button" title="Requests waiting for you" data-i18n="title"></button>
      <button id="side-collapse" class="icon-btn" type="button" title="Hide sidebar (⌘B)" aria-label="Hide sidebar" data-i18n="aria-label"></button>
    </div>
    <div class="tabs side-tabs" role="tablist" aria-label="Sidebar" data-i18n="aria-label">
      <button id="tab-chats" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="side-chats" data-tab="chats" data-i18n>Chats</button>
      <button id="tab-bots" class="tab" type="button" role="tab" aria-selected="false" aria-controls="side-bots" tabindex="-1" data-tab="bots" data-i18n>Bots &amp; groups</button>
    </div>
    <div id="side-chats" class="side-pane" role="tabpanel" aria-labelledby="tab-chats">
      <div class="side-actions">
        <button id="new-chat" class="new-btn" type="button" title="New chat (⇧⌘O)"><span class="plus" aria-hidden="true">+</span><span class="label" data-i18n>New chat</span><kbd>⇧⌘O</kbd></button>
      </div>
      <div class="section-head"><span data-i18n>Recent</span><span id="chat-count"></span></div>
      <div id="chat-list" class="list"></div>
    </div>
    <div id="side-bots" class="side-pane hidden" role="tabpanel" aria-labelledby="tab-bots">
      <div class="section-head"><span data-i18n>Bots</span><span class="head-actions"><button id="team-templates" class="btn btn-ghost btn-sm" type="button" title="Add a ready-made team of bots and groups" data-i18n="text title">Templates</button><button id="new-bot" class="btn btn-ghost btn-sm" type="button" data-i18n>+ New bot</button></span></div>
      <div id="bot-list" class="list"></div>
      <div class="section-head"><span data-i18n>Groups</span><span class="head-actions"><button id="import-team" class="btn btn-ghost btn-sm" type="button" title="Choose a Markdown role file" data-i18n="text title">Import team</button><button id="new-group" class="btn btn-ghost btn-sm" type="button" data-i18n>+ New group</button></span></div>
      <input id="team-file" type="file" accept=".md,.markdown,text/markdown" hidden>
      <div id="group-list" class="list"></div>
    </div>
    <div class="side-foot">
      <div class="foot-row">
        <button id="open-settings" class="foot-btn" type="button" title="Settings (⌘,)"></button>
        <div id="conn" class="conn"></div>
      </div>
      <div id="usage" class="usage" title="Model usage recorded in the ledger" data-i18n="title"></div>
    </div>
    <div id="side-resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar (double-click to reset)" data-i18n="aria-label" tabindex="0"></div>
  </aside>

  <main id="main" class="main">
    <header id="conv-head" class="conv-head"></header>
    <div id="banner" class="banner hidden"></div>
    <div id="board" class="board hidden" aria-label="Task board" data-i18n="aria-label"></div>
    <div id="scroller" class="scroller">
      <div id="messages" class="messages"></div>
      <div id="hitl-cards" class="hitl-cards"></div>
    </div>
    <div class="composer-wrap">
      <div id="plan" class="plan hidden" aria-label="The agent's plan" data-i18n="aria-label"></div>
      <div id="live" class="live hidden" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="mention-pop" class="mention-pop hidden" role="listbox" aria-label="Mention a bot" data-i18n="aria-label"></div>
        <div id="attachments" class="attachments hidden" aria-label="Attached files" data-i18n="aria-label"></div>
        <div class="composer-line">
          <button type="button" id="attach" class="attach-btn" title="Add files (or drop / paste them here)" aria-label="Add files" data-i18n="title aria-label">+</button>
          <input type="file" id="file-input" multiple hidden>
          <textarea id="input" rows="1" placeholder="Message PlanD…" aria-label="Message" aria-autocomplete="list" aria-controls="mention-pop" data-i18n="placeholder aria-label"></textarea>
          <div class="pick-wrap">
            <button type="button" id="model-pick" class="pick hidden" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu"></button>
            <div id="model-menu" class="pick-menu hidden" role="menu"></div>
          </div>
          <div class="pick-wrap">
            <button type="button" id="think" class="pick hidden" aria-haspopup="menu" aria-expanded="false" aria-controls="think-menu"></button>
            <div id="think-menu" class="pick-menu hidden" role="menu"></div>
          </div>
          <button type="button" id="stop" class="btn btn-stop hidden" data-i18n>Stop</button>
          <button type="submit" id="send" class="send-btn" aria-label="Send" title="Send (Enter) · Shift+Enter for a new line" data-i18n="aria-label title">&#8593;</button>
        </div>
      </form>
      <div class="composer-hint" aria-hidden="true"><span><kbd>↵</kbd> <span data-i18n>send</span></span><span><kbd>⇧↵</kbd> <span data-i18n>new line</span></span><span><kbd>@</kbd> <span data-i18n>mention a bot</span></span><span><kbd>⌘B</kbd> <span data-i18n>sidebar</span></span></div>
    </div>
  </main>

  <aside id="panel" class="panel hidden" aria-label="Details" data-i18n="aria-label"></aside>
</div>
<div id="settings" class="settings hidden" role="dialog" aria-modal="true" aria-label="Settings" data-i18n="aria-label"></div>
<div id="tray" class="tray hidden" role="dialog" aria-label="Waiting for you" data-i18n="aria-label" tabindex="-1"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="start.js"></script>
</body>
</html>
