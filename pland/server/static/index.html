<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PlanD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Conversations">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <div class="brand-name">PlanD</div>
        <div id="brand-sub" class="brand-sub">connecting…</div>
      </div>
      <button id="hitl-badge" class="hitl-badge hidden" type="button" title="Requests waiting for you"></button>
    </div>
    <div class="tabs side-tabs" role="tablist">
      <button class="tab active" type="button" role="tab" data-tab="chats">Chats</button>
      <button class="tab" type="button" role="tab" data-tab="bots">Bots</button>
    </div>
    <div id="side-chats" class="side-pane">
      <div class="side-actions">
        <button id="new-chat" class="btn btn-primary btn-block" type="button">New chat</button>
      </div>
      <div id="chat-list" class="list"></div>
    </div>
    <div id="side-bots" class="side-pane hidden">
      <div class="section-head"><span>Bots</span><button id="new-bot" class="btn btn-ghost btn-sm" type="button">+ New bot</button></div>
      <div id="bot-list" class="list"></div>
      <div class="section-head"><span>Groups</span><button id="new-group" class="btn btn-ghost btn-sm" type="button">+ New group</button></div>
      <div id="group-list" class="list"></div>
    </div>
    <div class="side-foot">
      <div id="usage" class="usage" title="Model usage recorded in the ledger"></div>
      <div id="conn" class="conn"></div>
    </div>
  </aside>

  <main id="main" class="main">
    <header id="conv-head" class="conv-head"></header>
    <div id="banner" class="banner hidden"></div>
    <div id="scroller" class="scroller">
      <div id="messages" class="messages"></div>
      <div id="hitl-cards" class="hitl-cards"></div>
    </div>
    <div class="composer-wrap">
      <div id="plan" class="plan hidden" aria-label="The agent's plan"></div>
      <div id="live" class="live hidden" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="mention-pop" class="mention-pop hidden" role="listbox"></div>
        <textarea id="input" rows="1" placeholder="Message PlanD…" aria-label="Message"></textarea>
        <div class="composer-row">
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button type="button" id="stop" class="btn btn-stop hidden">Stop</button>
          <button type="submit" id="send" class="btn btn-primary">Send</button>
        </div>
      </form>
    </div>
  </main>

  <aside id="panel" class="panel hidden" aria-label="Details"></aside>
</div>
<div id="tray" class="tray hidden" role="dialog" aria-label="Waiting for you"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
