    import hashlib
    def norm_hash(p):
        t = "\n".join(l.rstrip() for l in Path(p).read_text(encoding="utf-8").strip().splitlines())
        return hashlib.sha256(t.encode("utf-8")).hexdigest()
    for rel, h in {'tests/test_models.py': '0483d80fe20bff0887934c9b081932ca18040e12e0cc9f2047d2ce810cf64dba', 'tests/test_parser.py': '5b8dc87ab6da64808c67eb3e7aca55038f3ea81af9727ccb40f50bce1d43d5c8', 'tests/test_pricing.py': '28318ae9d9d732c08dbec6ac2c361c42e0b342d3b0972a5266649bd5a0635de7', 'tests/test_report.py': 'a07790a3afc1b2ee6e44bb61312774895f7e29ed601daac22e0687dd5945c80c'}.items():
