memory: carry
checks:
- id: format
  type: python
  code: |
    import re
    lines = [l.rstrip() for l in path('stats/report-02.txt').read_text(encoding="utf-8").strip().splitlines()]
    pats = [r"requests: \d+", r"errors: \d+", r"error_rate: \d+\.\d{2}%", r"p95_ms: \d+", r"slowest_endpoint: /\S*"]
    assert len(lines) == 5, f"expected exactly 5 lines, got {len(lines)}: {lines}"
    for line, pat in zip(lines, pats):
        assert re.fullmatch(pat, line), f"line {line!r} does not match the required format {pat!r}"
- id: requests
  type: python
  code: |
    import re
    lines = [l.strip() for l in path('stats/report-02.txt').read_text(encoding="utf-8").splitlines() if l.strip()]
    vals = dict(l.split(":", 1) for l in lines if ":" in l)
    vals = {k.strip(): v.strip() for k, v in vals.items()}
    key, want = 'requests', 53
    assert key in vals, f"no '{key}:' line in stats/report-02.txt"
    got = vals[key]
    assert re.fullmatch(r"\d+", got) and int(got) == want, f"{key}: got {got!r}, expected {want}"
- id: errors
  type: python
  code: |
    import re
    lines = [l.strip() for l in path('stats/report-02.txt').read_text(encoding="utf-8").splitlines() if l.strip()]
    vals = dict(l.split(":", 1) for l in lines if ":" in l)
    vals = {k.strip(): v.strip() for k, v in vals.items()}
    key, want = 'errors', 3
    assert key in vals, f"no '{key}:' line in stats/report-02.txt"
    got = vals[key]
    assert re.fullmatch(r"\d+", got) and int(got) == want, f"{key}: got {got!r}, expected {want}"
- id: error-rate
  type: python
  code: |
    import re
    lines = [l.strip() for l in path('stats/report-02.txt').read_text(encoding="utf-8").splitlines() if l.strip()]
    vals = dict(l.split(":", 1) for l in lines if ":" in l)
    vals = {k.strip(): v.strip() for k, v in vals.items()}
    key, want = 'error_rate', '5.66'
    assert key in vals, f"no '{key}:' line in stats/report-02.txt"
    got = vals[key]
    got_num = float(got.rstrip("%").strip())
    assert abs(got_num - float(want)) < 0.006, f"error_rate: got {got}, expected {want}%"
- id: p95-ms
  type: python
  code: |
    import re
    lines = [l.strip() for l in path('stats/report-02.txt').read_text(encoding="utf-8").splitlines() if l.strip()]
    vals = dict(l.split(":", 1) for l in lines if ":" in l)
    vals = {k.strip(): v.strip() for k, v in vals.items()}
    key, want = 'p95_ms', 861
    assert key in vals, f"no '{key}:' line in stats/report-02.txt"
    got = vals[key]
    assert re.fullmatch(r"\d+", got) and int(got) == want, f"{key}: got {got!r}, expected {want}"
- id: slowest-endpoint
  type: python
  code: |
    import re
    lines = [l.strip() for l in path('stats/report-02.txt').read_text(encoding="utf-8").splitlines() if l.strip()]
    vals = dict(l.split(":", 1) for l in lines if ":" in l)
    vals = {k.strip(): v.strip() for k, v in vals.items()}
    key, want = 'slowest_endpoint', '/api/invoices/pdf'
    assert key in vals, f"no '{key}:' line in stats/report-02.txt"
    got = vals[key]
    assert got == want, f"slowest_endpoint: got {got!r}, expected {want!r}"
required:
- format
- requests
- errors
- error-rate
- p95-ms
- slowest-endpoint
