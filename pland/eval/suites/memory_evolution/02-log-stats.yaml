# memory_evolution 02 — log format: float ms. The simulated user refuses to repeat the conventions; only memory from earlier tasks helps.
# expected: {'requests': 53, 'errors': 3, 'error_rate': '5.66', 'p95_ms': 861, 'slowest_endpoint': '/api/invoices/pdf'}
# traps (field changed if the convention is ignored): {'health': ['requests', 'error_rate', 'p95_ms', 'slowest_endpoint'], '4xx': ['errors', 'error_rate'], 'query': ['slowest_endpoint'], 'p95': ['p95_ms'], 'unit': 'float ms'}
id: memevo-02
title: 'Log statistics #2 (float ms)'
category: memory
prompt: |
  Compute our standard request statistics for `logs/events-02.jsonl` and write them to `stats/report-02.txt`.

  `logs/events-02.jsonl` has one JSON object per line:
  `{"time": ..., "req": {"method": ..., "url": <path incl. query string>}, "res": {"status": ...}, "duration_ms": <latency in ms, may have decimals>}`.

  Apply our team's conventions for request-log statistics (if you don't know them, ask me).

  The file must contain exactly these five lines, in this order, and nothing else:
  requests: <number of requests counted>
  errors: <number of requests counted as errors>
  error_rate: <errors / requests × 100, with exactly two decimals>%
  p95_ms: <95th-percentile latency in whole milliseconds>
  slowest_endpoint: <endpoint with the highest mean latency>
