# memory_evolution 03 — log format: mixed ms/s suffix. The simulated user refuses to repeat the conventions; only memory from earlier tasks helps.
# expected: {'requests': 51, 'errors': 3, 'error_rate': '5.88', 'p95_ms': 604, 'slowest_endpoint': '/api/recommendations'}
# traps (field changed if the convention is ignored): {'health': ['requests', 'error_rate', 'p95_ms', 'slowest_endpoint'], '4xx': ['errors', 'error_rate'], 'query': ['slowest_endpoint'], 'p95': ['p95_ms'], 'unit': 'mixed ms/s suffix'}
id: memevo-03
title: 'Log statistics #3 (mixed ms/s suffix)'
category: memory
prompt: |
  Compute our standard request statistics for `logs/requests-03.csv` and write them to `stats/report-03.txt`.

  `logs/requests-03.csv` is a CSV file with the header `timestamp,client,method,endpoint,status,latency`;
  `endpoint` is the requested path (incl. query string) and `latency` carries a unit suffix, e.g. `87ms` or `1.25s`.

  Apply our team's conventions for request-log statistics (if you don't know them, ask me).

  The file must contain exactly these five lines, in this order, and nothing else:
  requests: <number of requests counted>
  errors: <number of requests counted as errors>
  error_rate: <errors / requests × 100, with exactly two decimals>%
  p95_ms: <95th-percentile latency in whole milliseconds>
  slowest_endpoint: <endpoint with the highest mean latency>
