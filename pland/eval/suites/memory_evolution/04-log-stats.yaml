# memory_evolution 04 — log format: took= ms/s. The simulated user refuses to repeat the conventions; only memory from earlier tasks helps.
# expected: {'requests': 49, 'errors': 4, 'error_rate': '8.16', 'p95_ms': 1163, 'slowest_endpoint': '/api/exports/csv'}
# traps (field changed if the convention is ignored): {'health': ['requests', 'error_rate', 'p95_ms', 'slowest_endpoint'], '4xx': ['errors', 'error_rate'], 'query': ['slowest_endpoint'], 'p95': ['p95_ms'], 'unit': 'took= ms/s'}
id: memevo-04
title: 'Log statistics #4 (took= ms/s)'
category: memory
prompt: |
  Compute our standard request statistics for `logs/app-04.log` and write them to `stats/report-04.txt`.

  `logs/app-04.log` is an application log in logfmt (`key=value` pairs separated by spaces). Request lines look like
  `ts=<timestamp> level=<level> method=<METHOD> path=<path incl. query string> status=<status> took=<latency with unit, e.g. 45ms or 1.2s>`;
  the file also contains other log lines that are not requests.

  Apply our team's conventions for request-log statistics (if you don't know them, ask me).

  The file must contain exactly these five lines, in this order, and nothing else:
  requests: <number of requests counted>
  errors: <number of requests counted as errors>
  error_rate: <errors / requests × 100, with exactly two decimals>%
  p95_ms: <95th-percentile latency in whole milliseconds>
  slowest_endpoint: <endpoint with the highest mean latency>
