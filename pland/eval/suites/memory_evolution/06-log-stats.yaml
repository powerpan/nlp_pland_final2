# memory_evolution 06 — log format: seconds, two files. The simulated user refuses to repeat the conventions; only memory from earlier tasks helps.
# expected: {'requests': 55, 'errors': 3, 'error_rate': '5.45', 'p95_ms': 1136, 'slowest_endpoint': '/api/batch/import'}
# traps (field changed if the convention is ignored): {'health': ['requests', 'error_rate', 'p95_ms', 'slowest_endpoint'], '4xx': ['errors', 'error_rate'], 'query': ['slowest_endpoint'], 'p95': ['p95_ms'], 'unit': 'seconds, two files'}
id: memevo-06
title: 'Log statistics #6 (seconds, two files)'
category: memory
prompt: |
  Compute our standard request statistics for `logs/web-06.log.1` and `logs/web-06.log` and write them to `stats/report-06.txt`.

  The log for this period was rotated into two files, `logs/web-06.log.1` (older part) and `logs/web-06.log`
  (newer part); both belong to the same report. Each file starts with the header line
  `time|method|path|status|seconds` followed by pipe-separated rows (`path` includes the query string,
  `seconds` is the latency in seconds).

  Apply our team's conventions for request-log statistics (if you don't know them, ask me).

  The file must contain exactly these five lines, in this order, and nothing else:
  requests: <number of requests counted>
  errors: <number of requests counted as errors>
  error_rate: <errors / requests × 100, with exactly two decimals>%
  p95_ms: <95th-percentile latency in whole milliseconds>
  slowest_endpoint: <endpoint with the highest mean latency>
