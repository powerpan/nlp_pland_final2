# memory_evolution 05 — log format: microseconds. The simulated user refuses to repeat the conventions; only memory from earlier tasks helps.
# expected: {'requests': 51, 'errors': 4, 'error_rate': '7.84', 'p95_ms': 900, 'slowest_endpoint': '/api/analytics/daily'}
# traps (field changed if the convention is ignored): {'health': ['requests', 'error_rate', 'p95_ms', 'slowest_endpoint'], '4xx': ['errors', 'error_rate'], 'query': ['slowest_endpoint'], 'p95': ['p95_ms'], 'unit': 'microseconds'}
id: memevo-05
title: 'Log statistics #5 (microseconds)'
category: memory
prompt: |
  Compute our standard request statistics for `logs/apache-05.log` and write them to `stats/report-05.txt`.

  `logs/apache-05.log` uses the Apache common log format followed by `%D`:
  `<client ip> - <user> [<timestamp>] "<METHOD> <path> <protocol>" <status> <bytes> <response time in MICROseconds>`.

  Apply our team's conventions for request-log statistics (if you don't know them, ask me).

  The file must contain exactly these five lines, in this order, and nothing else:
  requests: <number of requests counted>
  errors: <number of requests counted as errors>
  error_rate: <errors / requests × 100, with exactly two decimals>%
  p95_ms: <95th-percentile latency in whole milliseconds>
  slowest_endpoint: <endpoint with the highest mean latency>
