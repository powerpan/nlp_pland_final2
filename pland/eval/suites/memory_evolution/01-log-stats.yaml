# memory_evolution 01 — log format: seconds (rt=). The conventions are revealed only through the clarification answer in THIS task.
# expected: {'requests': 47, 'errors': 7, 'error_rate': '14.89', 'p95_ms': 919, 'slowest_endpoint': '/api/reports/export'}
# traps (field changed if the convention is ignored): {'health': ['requests', 'error_rate', 'p95_ms', 'slowest_endpoint'], '4xx': ['errors', 'error_rate'], 'query': ['slowest_endpoint'], 'p95': ['p95_ms'], 'unit': 'seconds (rt=)'}
id: memevo-01
title: 'Log statistics #1 (seconds (rt=))'
category: memory
prompt: |
  Compute our standard request statistics for `logs/access-01.log` and write them to `stats/report-01.txt`.

  Each line of `logs/access-01.log` is an nginx access-log entry:
  `<client ip> - - [<timestamp>] "<METHOD> <path> <protocol>" <status> <response bytes> rt=<response time in seconds>`.

  Apply our team's conventions for request-log statistics (if you don't know them, ask me).

  The file must contain exactly these five lines, in this order, and nothing else:
  requests: <number of requests counted>
  errors: <number of requests counted as errors>
  error_rate: <errors / requests × 100, with exactly two decimals>%
  p95_ms: <95th-percentile latency in whole milliseconds>
  slowest_endpoint: <endpoint with the highest mean latency>
