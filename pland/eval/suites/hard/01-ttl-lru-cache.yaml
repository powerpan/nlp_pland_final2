    c3.set("d", "xxx")
    assert calls == ["a", "b", "c"] and c3.keys() == ["d"], f"callback exceptions must be ignored and all removals reported: {calls}, {c3.keys()}"
    gate, entered = threading.Event(), threading.Event()
    def slow(k, v, r):
        entered.set()
        gate.wait(10)
    c4 = TTLCache(1, on_evict=slow)
