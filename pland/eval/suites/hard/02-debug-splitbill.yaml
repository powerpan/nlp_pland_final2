        got = [l.rstrip() for l in r.stdout.strip().splitlines()]
        want = [l.rstrip() for l in 'Balances (EUR):\n  dora: +11.86\n  emil: +34.23\n  finn: -54.12\n  gus: +8.03\n\nTransfers:\n  finn -> emil: 34.23\n  finn -> dora: 11.86\n  finn -> gus: 8.03\n'.strip().splitlines()]
        assert got == want, "CLI report differs. expected: " + " | ".join(want) + "  got: " + " | ".join(got)
