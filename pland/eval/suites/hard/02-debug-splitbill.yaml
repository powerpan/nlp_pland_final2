    import re, subprocess, sys
    def pytest_in(cwd, min_passed, *args):
        r = subprocess.run([sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider", *args], cwd=str(cwd),
                           capture_output=True, text=True, timeout=240)
