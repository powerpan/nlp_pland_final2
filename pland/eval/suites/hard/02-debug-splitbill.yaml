    from splitbill.fx import convert
    from splitbill.money import allocate, format_cents, parse_amount
    from splitbill.ledger import balances
    from splitbill.models import Expense
    from splitbill.settle import settle
    calls, want = {'convert': [(1000, 'USD', 'EUR'), (1, 'EUR', 'X'), (5, 'X', 'EUR'), (3, 'X', 'EUR'), (100000, 'SEK', 'EUR'), (4550, 'CHF', 'EUR'), (1080, 'USD', 'EUR'), (999, 'EUR', 'USD'), (12345, 'USD', 'SEK'), (7, 'EUR', 'EUR')], 'allocate': [(10, [1, 1, 1, 1]), (7, [0, 1, 1]), (100, [1, 1, 1]), (5, [2, 1, 2]), (1, [1, 1]), (2, [1, 3, 1, 3]), (1001, [5, 3, 2]), (0, [1, 2])], 'parse': ['0.5', '1,000', '10.05', '1,234,567.8', ' 3 '], 'parse_bad': ['1,0000', '1 000', '12.345', '-0.10', '1,23.45', ''], 'format': [-5, -1205, 7, 100, 0]}, {'convert': [926, 2, 3, 2, 8795, 4840, 1000, 1079, 129965, 7], 'allocate': [[3, 3, 2, 2], [0, 4, 3], [34, 33, 33], [2, 1, 2], [1, 0], [0, 1, 0, 1], [501, 300, 200], [0, 0]], 'parse': [50, 100000, 1005, 123456780, 300], 'format': ['-0.05', '-12.05', '0.07', '1.00', '0.00'], 'balances': {'dora': 2444, 'emil': 1454, 'finn': -3898}, 'settle': [['finn', 'dora', 2444], ['finn', 'emil', 1454]]}
