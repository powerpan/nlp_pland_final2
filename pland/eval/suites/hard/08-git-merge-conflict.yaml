- id: merge-commit
  type: python
  code: |
    import subprocess
    def git(*args, cwd=None):
        return subprocess.run(["git", *args], cwd=None if cwd is None else str(cwd), capture_output=True, text=True, timeout=60)
    import hashlib, io, subprocess, tarfile, tempfile
    def norm(t):
        return "\n".join(l.rstrip() for l in t.strip().splitlines())
    def main_parents():
        r = git("rev-list", "--parents", "-n", "1", "refs/heads/main", cwd=path("store"))
        parts = r.stdout.split()
        assert r.returncode == 0 and len(parts) == 3, f"main must point to a merge commit with exactly two parents (rev-list --parents: {parts})"
        return parts
    def extract(rev, d):
        r = subprocess.run(["git", "archive", "--format=tar", rev], cwd=str(path("store")), capture_output=True, timeout=60)
        assert r.returncode == 0, f"cannot read the tree of {rev}"
        with tarfile.open(fileobj=io.BytesIO(r.stdout)) as tf:
            tf.extractall(d)
        return Path(d)
    head, p1, p2 = main_parents()
    feat = git("rev-parse", "refs/heads/feature/tiered-discounts", cwd=path("store")).stdout.strip()
    assert p2 == feat, "the second parent of main's merge commit must be the unchanged tip of feature/tiered-discounts"
    for rev, files, what in ((p1, {'.gitignore': '7da60b4ba3747566134af2634336235460baf5e12bfb1750f17d420546745975', 'conftest.py': 'af1fdf40436037573f03b505e582abc0fc806dc66604adaa8165580f6585e4cb', 'shop/__init__.py': '0c39d21ec133c1cc53e56e59538b207e5bba490f485fad2fcfdbe1f037f19956', 'shop/pricing.py': '4cdd7828953d7866665ee807bf4f4301df8d9935280aa79112ff7d6fb86dcb8a', 'tests/test_pricing.py': '7cf85633488ea5c092ec60ccee98685619af176a8e92e800fc1de308f5c7dceb', 'CHANGELOG.md': '95c4150340910b37dd082810888923bf2ebcf1f3b4181e812114a60af57587e5', 'config.json': 'ef44493458b5d71077918765b5ccc151042e16176807de07cea3b15013502d72'}, "first parent / previous main tip"), (p2, {'.gitignore': '7da60b4ba3747566134af2634336235460baf5e12bfb1750f17d420546745975', 'conftest.py': 'af1fdf40436037573f03b505e582abc0fc806dc66604adaa8165580f6585e4cb', 'shop/__init__.py': '0c39d21ec133c1cc53e56e59538b207e5bba490f485fad2fcfdbe1f037f19956', 'shop/pricing.py': '95ff9dea7b8db7c91c4546a0d9307d71702b013b7136268606ee51b30d2dc258', 'tests/test_pricing.py': 'd599ee1aa076d12264b7705d0738b53b10e771e0714833c76a48ab0f2182e26d', 'CHANGELOG.md': 'aaba7954a68dec3a7096da8310bcb36513f167fc8792286b9ff94939b93171ad', 'config.json': '4d819b19393d198504b8ce1a96837702fa9a8caa6b46f2eee4f75a3dff8df8db', 'shop/cart.py': 'c6a4928923c3de6f8dffc0f923b6cb270fb53faed55a3729a6c16f57634a9faf', 'tests/test_cart.py': '3f79d85acf2e03d80f0af8125bc1fd3540fceb8eb328a740497b4b9cab00ddc4'}, "second parent / feature tip")):
