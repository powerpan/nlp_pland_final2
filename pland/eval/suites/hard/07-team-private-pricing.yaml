    '@catalog/pricing/rules_2026Q4.md': |
      # Pricing rules — Q4 2026 (valid 2026-10-01 to 2026-12-31)

      Use only `price_list_2026Q4.csv` for Q4 quotes (the Q3 list is kept for reference).

      1. Discontinued SKUs (`status` = discontinued) are quoted as their `replaced_by` SKU, same quantity, at the
         replacement's price.
      2. Line amount = quantity × unit price. Volume discount per line, by the line's quantity:
         10–19 → 3%, 20–49 → 6%, 50 or more → 10%. The discounted line amount is rounded half up to cents.
      3. Merchandise value = sum of the discounted lines. Customer tier discount on the merchandise value:
         bronze 0%, silver 2%, gold 4%, platinum 7%; the tier discount amount is rounded half up to cents.
      4. Net merchandise value = merchandise value − tier discount.
      5. Shipping by destination country: DE 5.90; AT, BE, FR, LU, NL 12.50; CH, GB, NO 24.00; everywhere else 39.00.
         Shipping is free when the net merchandise value is 750.00 or more.
      6. On a quote: subtotal = sum of the undiscounted line amounts (after rule 1); discount = subtotal − net
         merchandise value; total = net merchandise value + shipping. All amounts in EUR with two decimals.
timeout: 1800
memory: fresh
checks:
- {id: quotes-exist, type: file_exists, path: shared/quotes.csv}
- id: quotes-exact
  type: python
  code: |
    import csv, io
    def quote_rows(text):
        rows = [r for r in csv.reader(io.StringIO(text)) if r]
        assert rows and [h.strip() for h in rows[0]] == ["order_id", "customer", "subtotal", "discount", "shipping", "total"], f"header {rows[:1]}"
        return [[c.strip() for c in r] for r in rows[1:]]
    rows = quote_rows(path("shared/quotes.csv").read_text(encoding="utf-8"))
    want = quote_rows('order_id,customer,subtotal,discount,shipping,total\nORD-3001,Nordlicht GmbH,587.50,35.54,5.90,557.86\nORD-3002,Café Lumière SARL,627.85,19.91,12.50,620.44\nORD-3003,Polar Outfitters AS,1264.20,159.12,0.00,1105.08\n')
    assert [r[0] for r in rows] == [r[0] for r in want], f"orders {[r[0] for r in rows]} != {[r[0] for r in want]} (sorted by order_id)"
    bad = [f"{g} != expected {w}" for g, w in zip(rows, want) if g != w]
    assert not bad, "; ".join(bad)
- id: owner-consulted
  type: python
  code: |
    import json, sqlite3
    shared = path("shared").resolve()
    db = shared.parents[2] / "shared.db"
    assert db.is_file(), f"event log not found at {db}"
    con = sqlite3.connect(str(db), timeout=30)
    try:
        rows = con.execute("SELECT type, data FROM events WHERE room_id=? AND type IN ('delegation.finished', 'message.replied', 'room.member_turn')",
                           (shared.parent.name,)).fetchall()
    finally:
        con.close()
    asked = []
    for typ, data in rows:
        d = json.loads(data)
        if typ in ("delegation.finished", "message.replied") and d.get("to") == "catalog" and d.get("status") == "completed":
            asked.append(typ)
        elif typ == "room.member_turn" and d.get("member") == "catalog" and d.get("role") == "mentioned" and d.get("state") == "done":
            asked.append(typ)
    assert asked, "@catalog was never asked: no completed delegation or message to catalog, and no @mention turn of catalog"
- {id: summary-written, type: file_exists, path: shared/quotes.md}
required: [quotes-exist, quotes-exact, owner-consulted]
